<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- One drawing at every size: icons/icon.svg (on the macOS icon grid, with margin and
         shadow) and icons/icon-maskable.svg are the sources; `bun run icons` renders the PNGs.
         Browsers that support an SVG icon use it and stay sharp at any size. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />

    <!-- Installable as a desktop app: Chrome and Edge read the manifest, Safari's
         "Add to Dock" reads the apple-touch-icon and the apple-mobile-web-app tags. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Remry" />
    <meta name="application-name" content="Remry" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#111111" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181b" />

    <!-- The drawers' remembered state, before the first paint, so a collapsed or resized
         drawer doesn't flash at its default (stores/drawers.ts keeps it in sync after).
         The nonce lets it past the Content Security Policy (svelte.config.js). -->
    <script nonce="%sveltekit.nonce%">
      try {
        var root = document.documentElement, store = localStorage;
        if (store.getItem('remry:left-open') === 'false') root.setAttribute('data-left-closed', '');
        if (store.getItem('remry:right-open') === 'false') root.setAttribute('data-right-closed', '');
        var w = Number(store.getItem('remry:sidebar-width'));
        if (w > 0) root.style.setProperty('--sidebar-drag-w', w + 'px');
        w = Number(store.getItem('remry:panel-width'));
        if (w > 0) root.style.setProperty('--panel-drag-w', w + 'px');
      } catch (e) { /* storage unavailable: defaults */ }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
