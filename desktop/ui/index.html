<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remry</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f5; --text: #1f1f1d; --muted: #6b6b66; --danger: #b3261e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1a; --text: #ececea; --muted: #a3a39e; --danger: #f2b8b5; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0; }
      #error { color: var(--danger); white-space: pre-line; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Remry</h1>
      <p id="status">Starting…</p>
      <p id="error" hidden></p>
    </main>
  </body>
</html>
