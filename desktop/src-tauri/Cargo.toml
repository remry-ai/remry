[package]
name = "remry-desktop"
version = "0.0.0"
description = "Remry desktop app: a window on the local Remry server"
edition = "2021"
publish = false

# The app's own executable is remry-desktop (the package name): the `remry` sidecar sits beside
# it in the same folder, so a shell also named `remry` would overwrite it in the bundle.
[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# deep-link: a remry:// link that starts a second instance is handed to the running one.
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
