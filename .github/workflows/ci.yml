# Lint, type checks and tests on every push and pull request.
# A successful run on main triggers release.yml.
name: CI

# Only on main: a push there is a release (release.yml runs after this passes). Branches and pull
# requests run the same lint, check and tests locally before they're pushed.
on:
  push:
    branches: [main]
    tags-ignore: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Integration tests
        run: bun run test:integration
