# Builds the desktop app (desktop/, Tauri 2) as a macOS .dmg and keeps it as a workflow
# artifact. It isn't part of the release yet. The app is ad-hoc signed, not notarized,
# so macOS asks before opening a downloaded copy. Windows (.msi) and Linux (.deb) builds
# come back once the macOS app is settled: add their rows to the matrix and bundles.
# Runs by hand from the Actions tab.
name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bunx prisma generate

      # The same binary the plugin ships, which the app bundles as its sidecar.
      - name: Build the remry binary
        run: bun run release:build --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: bun run release:smoke dist/plugin

      # Tauri's build script needs the sidecar in place, so tests come after this.
      - name: Put the binary in the desktop app
        run: bun run desktop:prepare

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build the desktop app
        run: bun run desktop:build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
