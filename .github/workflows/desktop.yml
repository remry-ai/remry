# Builds the desktop app (desktop/, Tauri 2) for macOS (Apple silicon) and Windows (x64),
# each on its own runner: the `remry` binary it bundles (scripts/release/build.ts), a smoke
# test of that binary, then the installer. release.yml calls it for every release; run it by
# hand from the Actions tab to try a build without publishing.
# macOS: with the APPLE_* secrets set (docs/DEVELOPMENT.md, "Signing the macOS app"), the app is
# signed with the Developer ID certificate and notarized; without them it's signed ad hoc, and
# macOS asks before opening a downloaded copy.
# Windows: with the AZURE_* repository variables set (docs/DEVELOPMENT.md, "Signing the Windows
# app"), the job signs in to Azure with GitHub's OIDC token (no secret) and Tauri signs the app,
# its sidecar and the installer with Azure Artifact Signing as it builds them; without them it
# isn't code-signed, and SmartScreen warns.
# With the TAURI_SIGNING_PRIVATE_KEY secret set (bun run desktop:updater-key), each build also
# makes a signed update for the app's updater. Code signing happens inside the build, before
# the update is signed, so the update's signature covers the code-signed installer.
name: Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true

permissions:
  contents: read
  # The OIDC token azure/login trades for an Azure session to sign the Windows build.
  id-token: write

env:
  BUN_VERSION: 1.3.13
  # The Artifact Signing client library SignTool loads to sign the Windows build (NuGet).
  ARTIFACT_SIGNING_CLIENT_VERSION: 1.0.128

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is new, so a failure there doesn't hold back the macOS release.
          - { target: darwin-arm64, os: macos-latest, required: true, bundles: 'app,dmg' }
          - { target: windows-x64, os: windows-latest, required: false, bundles: nsis }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    # A build takes about 10 minutes. Without a limit, a stuck step holds the release for GitHub's
    # 6-hour default, since publishing waits for every platform to finish, pass or fail.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bunx prisma generate

      - name: Build the remry binary
        run: bun run release:build --target ${{ matrix.target }}

      - name: Smoke test the binary
        timeout-minutes: 5
        run: bun run release:smoke

      # Tauri's build script needs the sidecar in place, so tests come after this.
      - name: Put the binary in the desktop app
        run: bun run desktop:prepare

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      # Windows code signing, only where the AZURE_* variables are set: an Azure session from
      # GitHub's OIDC token (the app registration trusts this repo's main branch), then SignTool
      # and the Artifact Signing library, which the build step hands to Tauri as its signCommand.
      - name: Sign in to Azure for code signing
        if: matrix.target == 'windows-x64' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Windows code signing
        if: matrix.target == 'windows-x64' && vars.AZURE_CLIENT_ID != ''
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$SIGNING_ENDPOINT" ] || [ -z "$SIGNING_ACCOUNT" ] || [ -z "$SIGNING_PROFILE" ]; then
            echo "AZURE_CLIENT_ID is set, but AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT or AZURE_SIGNING_PROFILE isn't."; exit 1
          fi
          dir="$RUNNER_TEMP/code-signing"
          mkdir -p "$dir"
          # SignTool from the latest SDK build tools: the library needs one newer than the runner's
          # older SDKs (10.0.20348's isn't supported).
          nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory "$dir" > /dev/null
          nuget install Microsoft.ArtifactSigning.Client -Version "$ARTIFACT_SIGNING_CLIENT_VERSION" -x -OutputDirectory "$dir" > /dev/null
          signtool=$(find "$dir/Microsoft.Windows.SDK.BuildTools" -path '*/x64/signtool.exe' | head -n 1)
          dlib=$(find "$dir/Microsoft.ArtifactSigning.Client" -path '*/x64/Azure.CodeSigning.Dlib.dll' | head -n 1)
          if [ -z "$signtool" ] || [ -z "$dlib" ]; then
            echo "Couldn't find the x64 signtool.exe or Azure.CodeSigning.Dlib.dll in the NuGet packages."; find "$dir" -name '*.exe' -o -name '*.dll' | head -n 40; exit 1
          fi
          # Only the Azure CLI session from azure/login, so the library doesn't try (and wait on)
          # the other credential types first.
          cat > "$dir/metadata.json" <<EOF
          {
            "Endpoint": "$SIGNING_ENDPOINT",
            "CodeSigningAccountName": "$SIGNING_ACCOUNT",
            "CertificateProfileName": "$SIGNING_PROFILE",
            "CorrelationId": "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}",
            "ExcludeCredentials": [
              "EnvironmentCredential",
              "ManagedIdentityCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            ]
          }
          EOF
          {
            echo "WINDOWS_SIGNTOOL=$(cygpath -w "$signtool")"
            echo "WINDOWS_SIGNING_DLIB=$(cygpath -w "$dlib")"
            echo "WINDOWS_SIGNING_METADATA=$(cygpath -w "$dir/metadata.json")"
          } >> "$GITHUB_ENV"
          echo "Signing the Windows app with Artifact Signing ($SIGNING_ACCOUNT/$SIGNING_PROFILE)."

      - name: Build the desktop app
        env:
          # The key has no password (scripts/desktop-updater-key.ts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Under other names: Tauri signs with a Developer ID whenever APPLE_CERTIFICATE is in its
          # environment, even empty, so the script exports the APPLE_* names only for a macOS build
          # with the certificate. Tauri imports it into a temporary keychain, signs with the
          # identity, and notarizes and staples the app with the App Store Connect API key.
          MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MAC_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_API_KEY: ${{ secrets.APPLE_API_KEY }}
          MAC_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          bundle='{}'
          # A signed update for the updater, only when there's a key to sign it with.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bundle='{"createUpdaterArtifacts":true}'
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret: building without a signed update."
          fi
          # The Developer ID identity replaces tauri.conf.json's ad hoc "-"; notarizing needs the
          # API key as a file. Without the certificate, the app is signed ad hoc.
          if [ "${{ matrix.target }}" = darwin-arm64 ] && [ -n "$MAC_CERTIFICATE" ]; then
            if [ -z "$MAC_SIGNING_IDENTITY" ] || [ -z "$MAC_API_ISSUER" ] || [ -z "$MAC_API_KEY" ] || [ -z "$MAC_API_PRIVATE_KEY" ]; then
              echo "The APPLE_CERTIFICATE secret is set, but APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY or APPLE_API_PRIVATE_KEY isn't."; exit 1
            fi
            export APPLE_CERTIFICATE="$MAC_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY" APPLE_API_ISSUER="$MAC_API_ISSUER" APPLE_API_KEY="$MAC_API_KEY"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$MAC_API_KEY.p8"
            printf '%s\n' "$MAC_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
            bundle=$(BUNDLE="$bundle" bun -e 'const b = JSON.parse(process.env.BUNDLE); b.macOS = { signingIdentity: process.env.APPLE_SIGNING_IDENTITY }; console.log(JSON.stringify(b))')
            echo "Signing the macOS app with the Developer ID, and notarizing it."
          elif [ "${{ matrix.target }}" = darwin-arm64 ]; then
            echo "No APPLE_CERTIFICATE secret: signing the macOS app ad hoc, without notarizing it."
          fi
          # Tauri runs the signCommand on each file it signs (the app, the remry sidecar, the
          # installer and its uninstaller), with %1 for the file, before it signs the update.
          if [ "${{ matrix.target }}" = windows-x64 ] && [ -n "$WINDOWS_SIGNTOOL" ]; then
            bundle=$(BUNDLE="$bundle" bun -e '
              const b = JSON.parse(process.env.BUNDLE);
              b.windows = { signCommand: { cmd: process.env.WINDOWS_SIGNTOOL, args: [
                "sign", "/v", "/fd", "SHA256", "/tr", "http://timestamp.acs.microsoft.com", "/td", "SHA256",
                "/dlib", process.env.WINDOWS_SIGNING_DLIB, "/dmdf", process.env.WINDOWS_SIGNING_METADATA, "%1",
              ] } };
              console.log(JSON.stringify(b));
            ')
          elif [ "${{ matrix.target }}" = windows-x64 ]; then
            echo "No AZURE_CLIENT_ID variable: building the Windows app without code signing."
          fi
          # From a file: on Windows, Git Bash rewrites arguments that look like POSIX paths, which
          # SignTool's /switches and the backslashed paths in the config would be mistaken for.
          config="$RUNNER_TEMP/tauri-build.json"
          printf '{"bundle":%s}\n' "$bundle" > "$config"
          bun run desktop:build --bundles ${{ matrix.bundles }} --config "$config"

      # 0.16.2 shipped a shell named like its sidecar, so the bundle held one of them and macOS
      # refused the broken signature. Check both are there and the signature holds.
      - name: Check the macOS app
        if: matrix.target == 'darwin-arm64'
        env:
          MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          app=desktop/src-tauri/target/release/bundle/macos/Remry.app
          ls -la "$app/Contents/MacOS"
          for f in remry remry-desktop; do
            if [ ! -s "$app/Contents/MacOS/$f" ]; then echo "Remry.app is missing Contents/MacOS/$f"; exit 1; fi
          done
          if [ "$(stat -f %z "$app/Contents/MacOS/remry")" -lt 20000000 ]; then echo "Contents/MacOS/remry is too small to be the remry binary"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          # 0.16.3 signed the sidecar with the hardened runtime but without entitlements, so library
          # validation refused the libsql module Bun unpacks and the server never started. Check
          # the sidecar carries Entitlements.plist, and that it can open a database.
          if ! codesign -d --entitlements - "$app/Contents/MacOS/remry" 2>&1 | grep -q disable-library-validation; then
            echo "Contents/MacOS/remry lacks Entitlements.plist; under the hardened runtime it can't load libsql"; exit 1
          fi
          # A Developer ID build must also pass Gatekeeper, with the notarization ticket stapled.
          if [ -n "$MAC_CERTIFICATE" ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi
          home=$(mktemp -d)
          HOME="$home" REMRY_MIGRATIONS_DIR="$app/Contents/Resources/migrations" "$app/Contents/MacOS/remry" notebook.list > "$home/out.json"
          grep -q '"ok": *true' "$home/out.json" || { cat "$home/out.json"; exit 1; }

      # A code-signed Windows build: the installer, the app and its sidecar each carry a valid
      # signature from the Artifact Signing certificate.
      - name: Check the Windows signatures
        if: matrix.target == 'windows-x64' && vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $release = 'desktop/src-tauri/target/release'
          $files = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe") + @(Get-Item "$release/remry-desktop.exe", "$release/remry.exe")
          $failed = $false
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Error 'A Windows file is not validly signed.'; exit 1 }

      # Names with the version, which latest.json points at, and a copy of each installer
      # without it, so the README links to releases/latest/download/<name> stay valid.
      - name: Collect the installer and update
        run: |
          version=$(cat dist/app/VERSION)
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p dist/desktop
          case "${{ matrix.target }}" in
            darwin-arm64)
              cp "$bundle"/dmg/*.dmg "dist/desktop/Remry-$version-macos-arm64.dmg"
              cp "$bundle"/dmg/*.dmg dist/desktop/Remry-macos-arm64.dmg
              for f in "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig; do
                if [ -e "$f" ]; then cp "$f" "dist/desktop/Remry-$version-macos-arm64.app.tar.gz${f##*.app.tar.gz}"; fi
              done
              ;;
            windows-x64)
              for f in "$bundle"/nsis/*-setup.exe "$bundle"/nsis/*-setup.exe.sig; do
                if [ -e "$f" ]; then cp "$f" "dist/desktop/Remry-$version-windows-x64-setup.exe${f##*-setup.exe}"; fi
              done
              cp "$bundle"/nsis/*-setup.exe dist/desktop/Remry-windows-x64-setup.exe
              ;;
          esac
          ls -la dist/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop
          if-no-files-found: error
