# Revokes a Remry Pro license, on a `repository_dispatch` from jweatherby.dev's Stripe webhook
# (api/remry/stripe.ts) after a full refund or a lost dispute. Rewrites
# src/shared/license/revoked.ts and opens a PR; merge it and release, and the key stops
# unlocking Pro once the app updates.
#
# The payload carries only the license id, its expiry and the reason: never a name, email or
# key, since this repo is public. Run it by hand from the Actions tab to revoke without Stripe.
name: Revoke a license

on:
  repository_dispatch:
    types: [remry-revoke]
  workflow_dispatch:
    inputs:
      id:
        description: "License id (stripe-<subscription id>)"
        required: true
      expires:
        description: "Its latest expiry (YYYY-MM-DD)"
        required: true
      reason:
        description: "Why, for the seller: refund or chargeback"
        required: true
        default: refund

concurrency:
  group: revoke
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      # Both triggers land in one place, so the revoke step reads the same three variables.
      - name: Read the request
        id: request
        env:
          DISPATCH_ID: ${{ github.event.client_payload.id }}
          DISPATCH_EXPIRES: ${{ github.event.client_payload.expires }}
          DISPATCH_REASON: ${{ github.event.client_payload.reason }}
          INPUT_ID: ${{ inputs.id }}
          INPUT_EXPIRES: ${{ inputs.expires }}
          INPUT_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          id="${DISPATCH_ID:-$INPUT_ID}"
          expires="${DISPATCH_EXPIRES:-$INPUT_EXPIRES}"
          reason="${DISPATCH_REASON:-$INPUT_REASON}"

          # Validated before use: these reach a shell and a commit message, and the id also
          # becomes part of a branch name.
          [[ "$id" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Bad license id: $id"; exit 1; }
          [[ "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad expiry: $expires"; exit 1; }
          [[ "$reason" =~ ^[a-z-]+$ ]] || { echo "Bad reason: $reason"; exit 1; }

          {
            echo "id=$id"
            echo "expires=$expires"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Revoke
        run: |
          bun run license:revoke \
            --id '${{ steps.request.outputs.id }}' \
            --expires '${{ steps.request.outputs.expires }}' \
            --reason '${{ steps.request.outputs.reason }}'

      - name: Open a PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: revoke/${{ steps.request.outputs.id }}
          base: main
          add-paths: src/shared/license/revoked.ts
          commit-message: "Revoke license ${{ steps.request.outputs.id }} (${{ steps.request.outputs.reason }})"
          title: "Revoke license ${{ steps.request.outputs.id }}"
          body: |
            `${{ steps.request.outputs.reason }}`, so this license no longer unlocks Pro.

            - id: `${{ steps.request.outputs.id }}`
            - expires: `${{ steps.request.outputs.expires }}`

            Merge and release: the key stops working once the app updates. Entries past
            their expiry are dropped on each run, so this list stays short.

            Opened by `revoke.yml` from a Stripe refund or lost dispute.
