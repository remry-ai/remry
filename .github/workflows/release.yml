# Publishes a release after CI passes on main, when the plugin version is new
# (set it with `bun run release:version <x.y.z>`):
#   1. builds the desktop app on macOS and Windows (desktop.yml)
#   2. force-pushes plugin/ to the `dist` branch and tags that commit dist-v<version>,
#      the tag marketplace.json pins the plugin to
#   3. creates GitHub release v<version> with the installers, the signed updates and
#      latest.json (which installed apps' updater reads), and the plugin zipped for Claude
#      desktop Chat uploads
#   4. points marketplace.json on main at the release (scripts/release/advertise.ts): Claude
#      desktop learns of an update from it, so it changes only once the release is out
# The plugin carries no app: its shim runs the desktop app's installed binary, or a clone.
# The release tag is created last, so a failed run is retried by re-running it.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  BUN_VERSION: 1.3.13

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Decide
        id: plan
        run: bun scripts/release/plan.ts

  desktop:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  publish:
    needs: [plan, desktop]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # A failed package download once stopped a release here, after both builds had passed.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "bun install failed (attempt $attempt); retrying."
            sleep 10
          done
          exit 1

      # One directory per platform that built; the macOS build is required, so it's always there.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true

      - name: Zip the plugin, and write latest.json for the updater
        run: |
          (cd plugin && zip -qr "../dist/release/remry-$VERSION.zip" .)
          bun scripts/release/updater-manifest.ts "$VERSION" dist/release
          ls -la dist/release

      - name: Publish the plugin to the dist branch, tagged dist-v<version>
        run: |
          # The plugin sits at the branch root: Cowork's marketplace sync ignores a
          # source `path` and requires .claude-plugin/plugin.json at the root.
          site=$(mktemp -d)
          cp -R plugin/. "$site/"
          test -f "$site/.claude-plugin/plugin.json"
          cd "$site"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Remry $VERSION, from $RELEASE_SHA"
          git tag "dist-v$VERSION"
          # Both at once, and --force so a re-run replaces a tag from a failed attempt.
          git push -q --force --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist "refs/tags/dist-v$VERSION"

      - name: Create the GitHub release
        run: |
          gh release create "v$VERSION" dist/release/* \
            --target "$RELEASE_SHA" \
            --title "Remry $VERSION" \
            --generate-notes

      # This commit starts no workflow: a push with GITHUB_TOKEN never does, [skip ci] says
      # so again, and plan.ts would skip a version that's already released. If this step
      # fails, the release is out: run advertise.ts <version> and push marketplace.json.
      - name: Point marketplace.json on main at the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            bun scripts/release/advertise.ts "$VERSION"
            if git diff --quiet; then exit 0; fi
            git commit -q -am "Point marketplace.json at Remry $VERSION [skip ci]"
            git push -q origin main && exit 0
            sleep 5
          done
          exit 1
